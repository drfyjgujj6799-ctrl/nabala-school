<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثانوية النبلاء النموذجية | استمارة القبول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FAF7F0;
    --surface:#FFFFFF;
    --surface-2:#F1EDE1;
    --primary:#1B4332;
    --primary-light:#2D6A4F;
    --accent:#B98900;
    --accent-soft:#F3E4B8;
    --text:#20241F;
    --text-muted:#63705F;
    --border:#E1DACB;
    --danger:#A6362C;
    --radius:12px;
    --font-display:'Cairo', 'Tahoma', sans-serif;
    --font-body:'Tajawal', 'Tahoma', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12211A;
      --surface:#183226;
      --surface-2:#1E3A2C;
      --primary:#5FAE86;
      --primary-light:#7FC49E;
      --accent:#E0B84C;
      --accent-soft:#33301B;
      --text:#EDF3EC;
      --text-muted:#A9BAAE;
      --border:#2C4536;
      --danger:#E28479;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12211A;
    --surface:#183226;
    --surface-2:#1E3A2C;
    --primary:#5FAE86;
    --primary-light:#7FC49E;
    --accent:#E0B84C;
    --accent-soft:#33301B;
    --text:#EDF3EC;
    --text-muted:#A9BAAE;
    --border:#2C4536;
    --danger:#E28479;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.6;
    min-height:100vh;
  }
  body.busy{opacity:.65;pointer-events:none;cursor:wait;}
  #app{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
  h1,h2,h3{font-family:var(--font-display);margin:0 0 6px;}
  a{color:inherit;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;margin-bottom:18px;border-bottom:2px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .crest{
    width:42px;height:42px;border-radius:50%;
    background:var(--primary);color:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:800;font-size:18px;
    border:2px solid var(--accent);
  }
  .brand .titles{display:flex;flex-direction:column;}
  .brand .titles strong{font-family:var(--font-display);font-size:16px;}
  .brand .titles span{font-size:12px;color:var(--text-muted);}
  .badge-local{
    font-size:11px;background:var(--accent-soft);color:var(--accent);
    padding:3px 9px;border-radius:999px;border:1px solid var(--accent);
  }
  .btn{
    font-family:var(--font-body);font-weight:700;font-size:14.5px;
    border:none;border-radius:var(--radius);padding:12px 20px;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-outline{background:transparent;color:var(--primary);border:2px solid var(--primary);}
  .btn-outline:hover{background:var(--primary);color:#fff;}
  .btn-gold{background:var(--accent);color:#241C00;}
  .btn-ghost{background:transparent;color:var(--text-muted);text-decoration:underline;padding:8px 4px;}
  .btn-danger{background:transparent;color:var(--danger);border:2px solid var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .hero{
    text-align:center;padding:38px 18px 30px;background:var(--surface);
    border-radius:20px;border:1px solid var(--border);margin-bottom:22px;
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0 0 auto 0;height:6px;
    background:linear-gradient(90deg,var(--primary),var(--accent));
  }
  .hero h1{font-size:26px;color:var(--primary);}
  .hero p{color:var(--text-muted);margin:6px 0 26px;font-size:15px;}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto;}
  @media (max-width:520px){.choice-grid{grid-template-columns:1fr;}}
  .choice-card{
    background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
    padding:22px 14px;cursor:pointer;text-align:center;transition:.15s;
  }
  .choice-card:hover{border-color:var(--primary);transform:translateY(-2px);}
  .choice-card .ico{font-size:30px;margin-bottom:8px;display:block;}
  .choice-card strong{display:block;font-family:var(--font-display);font-size:16px;color:var(--primary);}
  .choice-card span{font-size:12.5px;color:var(--text-muted);}
  .grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:620px;margin:0 auto;}
  @media (max-width:520px){.grade-grid{grid-template-columns:1fr;}}
  .class-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;max-width:620px;margin:0 auto;}
  @media (max-width:520px){.class-grid{grid-template-columns:1fr 1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;}
  .card h2{color:var(--primary);font-size:19px;}
  .card .sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}

  .steps-track{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .step-dot{
    flex:1;min-width:28px;height:6px;border-radius:99px;background:var(--border);
  }
  .step-dot.active{background:var(--primary);}
  .step-dot.done{background:var(--primary-light);}
  .step-label{font-size:13px;color:var(--text-muted);margin-bottom:14px;}

  .fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  @media (max-width:600px){.fields-grid{grid-template-columns:1fr;}}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--text);}
  .field em{color:var(--danger);font-style:normal;}
  .field input, .field select, .field textarea{
    font-family:var(--font-body);font-size:14.5px;padding:10px 12px;
    border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);
    outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}

  .section-block{margin-bottom:22px;padding-bottom:6px;border-bottom:1px dashed var(--border);}
  .section-block:last-child{border-bottom:none;}
  .section-block h3{color:var(--primary-light);font-size:15px;margin-bottom:12px;}

  .actions-row{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap;}
  .error-box{
    background:#F8E6E3;color:var(--danger);border:1px solid var(--danger);
    padding:10px 14px;border-radius:9px;font-size:13.5px;margin-bottom:14px;
  }
  :root[data-theme="dark"] .error-box, @media (prefers-color-scheme: dark){.error-box{background:#3A1E1B;}}

  .success-wrap{text-align:center;padding:30px 16px;}
  .success-wrap .ico{font-size:46px;}
  .req-number{
    font-family:var(--font-display);font-size:30px;letter-spacing:1px;color:var(--primary);
    background:var(--surface-2);border:2px dashed var(--accent);border-radius:14px;
    padding:16px;margin:20px 0;
  }

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .search-row{display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;margin-bottom:18px;}
  @media (max-width:680px){.search-row{grid-template-columns:1fr;}}
  .search-row input{
    font-family:var(--font-body);padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);
  }

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width:600px){.stats-row{grid-template-columns:1fr;}}
  .stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
  .stat-card .num{font-family:var(--font-display);font-size:24px;color:var(--primary);}
  .stat-card .lbl{font-size:12.5px;color:var(--text-muted);}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
  table{border-collapse:collapse;width:100%;min-width:720px;}
  th,td{padding:10px 12px;text-align:right;font-size:13.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{background:var(--surface-2);color:var(--primary);font-family:var(--font-display);font-size:13px;}
  tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;}
  .empty-state{text-align:center;padding:40px 16px;color:var(--text-muted);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    padding:16px;z-index:50;
  }
  .modal-box{background:var(--surface);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:16px 0;}
  @media (max-width:560px){.detail-grid{grid-template-columns:1fr;}}
  .detail-item{font-size:13.5px;}
  .detail-item .k{color:var(--text-muted);display:block;font-size:12px;}
  .detail-item .v{font-weight:600;}

  .login-form{max-width:380px;margin:0 auto;}
  .footnote{text-align:center;color:var(--text-muted);font-size:12px;margin-top:26px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= إعدادات الحقول ================= */
const SECTIONS = [
  { id:'s1', title:'بيانات الطالب الشخصية', fields:[
    {key:'name', label:'الاسم', type:'text', required:true},
    {key:'fatherName', label:'اسم الأب', type:'text', required:true},
    {key:'paternalGrandfather', label:'اسم والد الأب', type:'text'},
    {key:'paternalGreatGrandfather', label:'اسم جد الأب', type:'text'},
    {key:'lastName', label:'اللقب', type:'text', required:true},
    {key:'birthDate', label:'تاريخ التولد', type:'date', required:true},
    {key:'birthPlace', label:'محل الولادة', type:'text'},
    {key:'hometown', label:'مسقط الرأس', type:'text'},
    {key:'gender', label:'الجنس', type:'select', options:['ذكر','أنثى'], required:true},
    {key:'nationality', label:'الجنسية', type:'text', required:true},
  ]},
  { id:'s2', title:'بيانات الأم', fields:[
    {key:'motherName', label:'اسم الأم', type:'text', required:true},
    {key:'motherFather', label:'اسم والد الأم', type:'text'},
    {key:'motherGrandfather', label:'اسم جد الأم', type:'text'},
  ]},
  { id:'s3', title:'بيانات الهوية والإحصاء', fields:[
    {key:'studentIdType', label:'نوع هوية الطالب', type:'select', options:['بطاقة وطنية','جواز سفر','شهادة الجنسية','هوية الأحوال المدنية','أخرى']},
    {key:'studentIdCountry', label:'بلد إصدار هوية الطالب', type:'text'},
    {key:'fatherIdType', label:'نوع هوية الأب', type:'select', options:['بطاقة وطنية','جواز سفر','شهادة الجنسية','هوية الأحوال المدنية','أخرى']},
    {key:'fatherIdCountry', label:'بلد إصدار هوية الأب', type:'text'},
    {key:'statisticalNumber', label:'الرقم الإحصائي', type:'text', required:true},
  ]},
  { id:'s4', title:'معلومات إضافية', fields:[
    {key:'motherTongue', label:'اللغة الأم', type:'text'},
    {key:'bloodType', label:'فئة الدم', type:'select', options:['A+','A-','B+','B-','AB+','AB-','O+','O-','غير معروف']},
    {key:'religion', label:'الديانة', type:'text'},
    {key:'specialNeeds', label:'الاحتياجات الخاصة', type:'text', placeholder:'اكتب "لا يوجد" إن لم توجد'},
    {key:'studyLanguage', label:'لغة الدراسة', type:'select', options:['العربية','الإنكليزية','الكردية','أخرى']},
    {key:'livingStandard', label:'المستوى المعيشي', type:'select', options:['ميسور','متوسط','محدود']},
    {key:'careGrant', label:'مشمول بمنحة الرعاية', type:'select', options:['نعم','لا']},
  ]},
  { id:'s6', title:'العنوان ووسائل التواصل', fields:[
    {key:'place', label:'المكان', type:'text'},
    {key:'city', label:'المدينة', type:'text', required:true},
    {key:'district', label:'الحي', type:'text'},
    {key:'mahalla', label:'المحلة', type:'text'},
    {key:'alley', label:'الزقاق', type:'text'},
    {key:'address1', label:'عنوان 1', type:'text'},
    {key:'address2', label:'عنوان 2', type:'text'},
    {key:'landmark', label:'أقرب نقطة دالة', type:'text'},
    {key:'phone', label:'رقم الهاتف', type:'tel', required:true},
    {key:'email', label:'البريد الإلكتروني', type:'email'},
  ]},
];
const ALL_FIELDS = [
  {key:'grade', label:'الصف الدراسي', type:'text', required:true},
  {key:'section', label:'الشعبة', type:'text', required:true},
  ...SECTIONS.flatMap(s=>s.fields)
];
const GRADES = ['الأول متوسط','الثاني متوسط','الثالث متوسط','الرابع إعدادي','الخامس إعدادي','السادس إعدادي'];
const CLASS_SECTIONS = ['أ','ب','ج','د','هـ','و','ز'];
const ADMIN_USER = 'ahmed';
const ADMIN_PASS = '6578';
const LS_KEY = 'nb_school_requests_v1';

/* ================= إعدادات Firebase =================
   ضع هنا بيانات مشروعك من Firebase Console:
   Project settings ⚙️ -> عام -> "تطبيقاتك" -> إعدادات SDK -> Config
*/
const firebaseConfig = {
  apiKey: "AIzaSyAR6ofCfBk_zlAhfyBNM56V3wwFYls5EOw",
  authDomain: "mdrs-bfc12.firebaseapp.com",
  projectId: "mdrs-bfc12",
  storageBucket: "mdrs-bfc12.firebasestorage.app",
  messagingSenderId: "929056701943",
  appId: "1:929056701943:web:9ced5b997230bfc36202f2"
};

/* ================= الحالة ================= */
let state = {
  screen:'loading', // loading, login, student-grade, student-class, student-form, student-success, admin-login, admin-dashboard, admin-form
  studentStep:0,
  formData:{},
  formMode:'add',
  editingId:null,
  isAdmin:false,
  adminError:'',
  requests:[],
  filtered:null,
  successReqNumber:'',
  formError:'',
  viewingRequest:null,
};

let db=null, downloads=null;
const Store = {
  mode:'pending',
  async init(){
    try{
      const configReady = firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY';
      if(configReady && typeof firebase !== 'undefined'){
        if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
        db = firebase.firestore();
      }
    }catch(e){ db=null; }
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        downloads = await window.claude.use('downloads');
      }
    }catch(e){ downloads=null; }
    this.mode = db ? 'db' : 'local';
  },
  readLocal(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }catch(e){ return {}; }
  },
  writeLocal(all){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(all)); }catch(e){}
  },
  async listRequests(){
    if(this.mode==='db'){
      const snap = await db.collection('requests').orderBy('submittedAt','desc').limit(500).get();
      return snap.docs.map(d=>({ id:d.id, ...d.data() }));
    }
    const all = this.readLocal();
    return Object.keys(all).map(k=>({ id:k, ...all[k] })).sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
  },
  async exists(id){
    if(this.mode==='db'){
      const snap = await db.doc('requests/'+id).get();
      return snap.exists;
    }
    const all = this.readLocal();
    return !!all[id];
  },
  async addRequest(id, data){
    if(this.mode==='db'){
      await db.collection('requests').doc(id).set(data);
      return;
    }
    const all = this.readLocal();
    all[id] = data;
    this.writeLocal(all);
  },
  async updateRequest(id, data){
    return this.addRequest(id, data);
  },
  async deleteRequest(id){
    if(this.mode==='db'){
      await db.doc('requests/'+id).delete();
      return;
    }
    const all = this.readLocal();
    delete all[id];
    this.writeLocal(all);
  }
};

/* ================= أدوات مساعدة ================= */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fullName(r){
  return [r.name, r.fatherName, r.lastName].filter(Boolean).join(' ') || '(بدون اسم)';
}
function setBusy(v){ document.body.classList.toggle('busy', v); }
async function generateRequestNumber(){
  const year = new Date().getFullYear();
  for(let i=0;i<8;i++){
    const rand = Math.floor(100000 + Math.random()*900000);
    const candidate = 'NB-'+year+'-'+rand;
    const taken = await Store.exists(candidate);
    if(!taken) return candidate;
  }
  return 'NB-'+year+'-'+Date.now();
}
function validateFields(fields, data){
  const missing = [];
  fields.forEach(f=>{
    if(f.required && !String(data[f.key]||'').trim()) missing.push(f.label);
  });
  return missing;
}

/* ================= العرض (render) ================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='loading') html = renderLoading();
  else if(state.screen==='login') html = renderLogin();
  else if(state.screen==='student-grade') html = renderStudentGrade();
  else if(state.screen==='student-class') html = renderStudentClass();
  else if(state.screen==='student-form') html = renderStudentForm();
  else if(state.screen==='student-success') html = renderStudentSuccess();
  else if(state.screen==='admin-login') html = renderAdminLogin();
  else if(state.screen==='admin-dashboard') html = renderAdminDashboard();
  else if(state.screen==='admin-form') html = renderAdminForm();
  app.innerHTML = html;
  if(state.viewingRequest){
    app.insertAdjacentHTML('beforeend', renderDetailModal(state.viewingRequest));
  }
}

function renderLoading(){
  return '<div class="hero"><h1>جارٍ تحميل النظام...</h1><p>ثانوية النبلاء النموذجية</p></div>';
}

function topbar(withLogout){
  return `<div class="topbar">
    <div class="brand">
      <div class="crest">ن</div>
      <div class="titles">
        <strong>ثانوية النبلاء النموذجية</strong>
        <span>نظام استمارات القبول الإلكتروني</span>
      </div>
    </div>
    ${Store.mode==='local' ? '<span class="badge-local">تخزين محلي تجريبي</span>' : ''}
    ${withLogout ? '<button class="btn btn-ghost" data-action="logout">تسجيل الخروج</button>' : ''}
  </div>`;
}

function renderLogin(){
  return `
  ${topbar(false)}
  <div class="hero">
    <h1>مرحباً بكم في بوابة القبول</h1>
    <p>اختر طريقة الدخول للمتابعة</p>
    <div class="choice-grid">
      <div class="choice-card" data-action="go-student">
        <span class="ico">🎓</span>
        <strong>دخول كطالب</strong>
        <span>تعبئة استمارة بيانات جديدة</span>
      </div>
      <div class="choice-card" data-action="go-admin-login">
        <span class="ico">🗂️</span>
        <strong>دخول كمدير نظام</strong>
        <span>إدارة ومتابعة الطلبات</span>
      </div>
    </div>
  </div>
  <p class="footnote">جميع الحقوق محفوظة لثانوية النبلاء النموذجية</p>`;
}

function renderStudentGrade(){
  const cards = GRADES.map(g=>`
    <div class="choice-card" data-action="select-grade" data-grade="${escapeHtml(g)}">
      <span class="ico">📘</span>
      <strong>${escapeHtml(g)}</strong>
      <span>اضغط لاختيار الشعبة</span>
    </div>`).join('');
  return `
  ${topbar(false)}
  <div class="hero">
    <h1>اختر الصف الدراسي</h1>
    <p>حدد الصف الذي يرغب الطالب بالتسجيل فيه</p>
    <div class="grade-grid">${cards}</div>
    <div style="margin-top:18px;"><button class="btn btn-ghost" data-action="go-login">إلغاء والعودة</button></div>
  </div>`;
}

function renderStudentClass(){
  const cards = CLASS_SECTIONS.map(sec=>`
    <div class="choice-card" data-action="select-class" data-section="${escapeHtml(sec)}">
      <span class="ico">🏫</span>
      <strong>شعبة (${escapeHtml(sec)})</strong>
    </div>`).join('');
  return `
  ${topbar(false)}
  <div class="hero">
    <h1>اختر الشعبة</h1>
    <p>الصف المختار: <strong style="color:var(--primary)">${escapeHtml(state.formData.grade||'')}</strong></p>
    <div class="class-grid">${cards}</div>
    <div style="margin-top:18px;"><button class="btn btn-ghost" data-action="go-student">رجوع لاختيار الصف</button></div>
  </div>`;
}

function renderStudentForm(){
  const section = SECTIONS[state.studentStep];
  const total = SECTIONS.length;
  const dots = SECTIONS.map((s,i)=>{
    let cls='step-dot';
    if(i<state.studentStep) cls+=' done';
    if(i===state.studentStep) cls+=' active';
    return `<div class="${cls}"></div>`;
  }).join('');
  const fieldsHtml = section.fields.map(f=>renderField(f, state.formData[f.key])).join('');
  const isLast = state.studentStep === total-1;
  return `
  ${topbar(false)}
  <div class="card">
    <div class="steps-track">${dots}</div>
    <div class="step-label">الخطوة ${state.studentStep+1} من ${total}</div>
    <h2>${section.title}</h2>
    <div class="sub">الحقول المعلّمة بـ <em style="color:var(--danger)">*</em> إلزامية</div>
    ${state.formError ? `<div class="error-box">${escapeHtml(state.formError)}</div>` : ''}
    <div class="fields-grid">${fieldsHtml}</div>
    <div class="actions-row">
      <div>
        ${state.studentStep>0 ? '<button class="btn btn-outline" data-action="student-prev">السابق</button>' : '<button class="btn btn-ghost" data-action="go-login">إلغاء والعودة</button>'}
      </div>
      <div>
        ${isLast
          ? '<button class="btn btn-primary" data-action="student-submit">إرسال الطلب</button>'
          : '<button class="btn btn-primary" data-action="student-next">التالي</button>'}
      </div>
    </div>
  </div>`;
}

function renderField(f, value){
  const val = value==null ? '' : value;
  const req = f.required ? 'required' : '';
  let input='';
  if(f.type==='select'){
    const opts = f.options.map(o=>`<option value="${escapeHtml(o)}" ${o===val?'selected':''}>${escapeHtml(o)}</option>`).join('');
    input = `<select data-field="${f.key}" ${req}><option value="">اختر...</option>${opts}</select>`;
  } else {
    const ph = f.placeholder ? `placeholder="${escapeHtml(f.placeholder)}"` : '';
    input = `<input type="${f.type}" data-field="${f.key}" ${req} value="${escapeHtml(val)}" ${ph}>`;
  }
  return `<label class="field"><span>${escapeHtml(f.label)}${f.required?' <em>*</em>':''}</span>${input}</label>`;
}

function renderStudentSuccess(){
  return `
  ${topbar(false)}
  <div class="card success-wrap">
    <span class="ico">✅</span>
    <h2>تم استلام طلبك بنجاح</h2>
    <p style="color:var(--text-muted)">يرجى حفظ رقم الطلب التالي لمتابعة حالة معاملتك لاحقاً لدى إدارة المدرسة</p>
    <div class="req-number" id="req-num-display">${escapeHtml(state.successReqNumber)}</div>
    <button class="btn btn-outline btn-sm" data-action="copy-req">نسخ رقم الطلب</button>
    <div class="actions-row" style="justify-content:center;margin-top:24px;">
      <button class="btn btn-primary" data-action="go-login">العودة إلى صفحة الدخول</button>
    </div>
  </div>`;
}

function renderAdminLogin(){
  return `
  ${topbar(false)}
  <div class="card login-form">
    <h2 style="text-align:center">دخول مدير النظام</h2>
    ${state.adminError ? `<div class="error-box">${escapeHtml(state.adminError)}</div>` : ''}
    <div class="field" style="margin-bottom:14px;">
      <span>اسم المستخدم</span>
      <input type="text" id="admin-user-input" autocomplete="username">
    </div>
    <div class="field" style="margin-bottom:20px;">
      <span>كلمة المرور</span>
      <input type="password" id="admin-pass-input" autocomplete="current-password">
    </div>
    <div class="actions-row">
      <button class="btn btn-ghost" data-action="go-login">رجوع</button>
      <button class="btn btn-primary" data-action="admin-login-submit">دخول</button>
    </div>
  </div>`;
}

function getFilteredList(){
  return state.filtered !== null ? state.filtered : state.requests;
}

function renderAdminDashboard(){
  const list = getFilteredList();
  const today = new Date(); today.setHours(0,0,0,0);
  const todayCount = state.requests.filter(r=>r.submittedAt && r.submittedAt >= today.getTime()).length;
  const rows = list.map(r=>`
    <tr>
      <td>${escapeHtml(r.id)}</td>
      <td>${escapeHtml(fullName(r))}</td>
      <td>${escapeHtml(r.grade||'-')}</td>
      <td>${escapeHtml(r.section||'-')}</td>
      <td>${escapeHtml(r.statisticalNumber||'-')}</td>
      <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('ar-EG') : '-'}</td>
      <td class="row-actions">
        <button class="btn btn-outline btn-sm" data-action="view-request" data-id="${escapeHtml(r.id)}">عرض</button>
        <button class="btn btn-outline btn-sm" data-action="edit-request" data-id="${escapeHtml(r.id)}">تعديل</button>
        <button class="btn btn-danger btn-sm" data-action="delete-request" data-id="${escapeHtml(r.id)}">حذف</button>
      </td>
    </tr>`).join('');
  return `
  ${topbar(true)}
  <div class="stats-row">
    <div class="stat-card"><div class="num">${state.requests.length}</div><div class="lbl">إجمالي الطلبات</div></div>
    <div class="stat-card"><div class="num">${todayCount}</div><div class="lbl">طلبات اليوم</div></div>
    <div class="stat-card"><div class="num">${list.length}</div><div class="lbl">نتائج العرض الحالي</div></div>
  </div>
  <div class="toolbar">
    <button class="btn btn-primary" data-action="admin-add-new">+ إضافة طلب جديد</button>
    <button class="btn btn-gold" data-action="admin-export-excel">تصدير إلى إكسل</button>
    <button class="btn btn-outline" data-action="admin-refresh">تحديث القائمة</button>
  </div>
  <div class="card">
    <h2 style="font-size:16px;">البحث في الطلبات</h2>
    <div class="search-row">
      <input type="text" id="search-name-input" placeholder="ابحث بالاسم الكامل">
      <input type="text" id="search-stat-input" placeholder="ابحث بالرقم الإحصائي (رقم الهوية)">
      <button class="btn btn-primary btn-sm" data-action="do-search">بحث</button>
      <button class="btn btn-ghost btn-sm" data-action="reset-search">إظهار الكل</button>
    </div>
    ${list.length===0
      ? '<div class="empty-state">لا توجد طلبات مطابقة حالياً</div>'
      : `<div class="table-wrap"><table>
          <thead><tr><th>رقم الطلب</th><th>الاسم الكامل</th><th>الصف</th><th>الشعبة</th><th>الرقم الإحصائي</th><th>تاريخ التقديم</th><th>إجراءات</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>`}
  </div>`;
}

function renderAdminForm(){
  const sectionsHtml = SECTIONS.map(sec=>`
    <div class="section-block">
      <h3>${escapeHtml(sec.title)}</h3>
      <div class="fields-grid">${sec.fields.map(f=>renderField(f, state.formData[f.key])).join('')}</div>
    </div>`).join('');
  return `
  ${topbar(true)}
  <div class="card">
    <h2>${state.formMode==='add' ? 'إضافة طلب جديد' : 'تعديل بيانات الطلب'} ${state.editingId ? '('+escapeHtml(state.editingId)+')' : ''}</h2>
    ${state.formError ? `<div class="error-box">${escapeHtml(state.formError)}</div>` : ''}
    ${sectionsHtml}
    <div class="actions-row">
      <button class="btn btn-ghost" data-action="admin-cancel-form">إلغاء</button>
      <button class="btn btn-primary" data-action="admin-save-form">حفظ</button>
    </div>
  </div>`;
}

function renderDetailModal(r){
  const items = ALL_FIELDS.map(f=>`
    <div class="detail-item"><span class="k">${escapeHtml(f.label)}</span><span class="v">${escapeHtml(r[f.key]||'-')}</span></div>
  `).join('');
  return `
  <div class="modal-overlay" data-action="close-modal">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h2>تفاصيل الطلب ${escapeHtml(r.id)}</h2>
      <div class="sub" style="color:var(--text-muted);font-size:13px;">
        تاريخ التقديم: ${r.submittedAt ? new Date(r.submittedAt).toLocaleString('ar-EG') : '-'}
      </div>
      <div class="detail-grid">${items}</div>
      <div class="actions-row">
        <button class="btn btn-ghost" data-action="close-modal">إغلاق</button>
        <button class="btn btn-primary" data-action="edit-request" data-id="${escapeHtml(r.id)}">تعديل هذا الطلب</button>
      </div>

  </div>`;
}

/* ================= منطق الأحداث ================= */
document.getElementById('app').addEventListener('click', onAppClick);
document.getElementById('app').addEventListener('input', onAppInput);
document.getElementById('app').addEventListener('change', onAppInput);

function onAppInput(e){
  const key = e.target.dataset.field;
  if(key){ state.formData[key] = e.target.value; }
}

async function onAppClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if(action==='go-student'){
    state.formData = {}; state.studentStep = 0; state.formError=''; state.screen='student-grade'; render();
  }
  else if(action==='select-grade'){
    const grade = el.getAttribute('data-grade');
    state.formData = { grade }; state.screen='student-class'; render();
  }
  else if(action==='select-class'){
    const section = el.getAttribute('data-section');
    state.formData.section = section; state.studentStep = 0; state.formError=''; state.screen='student-form'; render();
  }
  else if(action==='go-admin-login'){
    state.adminError=''; state.screen='admin-login'; render();
  }
  else if(action==='go-login'){
    state.isAdmin=false; state.screen='login'; state.formData={}; render();
  }
  else if(action==='logout'){
    state.isAdmin=false; state.screen='login'; render();
  }
  else if(action==='student-prev'){
    state.studentStep = Math.max(0, state.studentStep-1); state.formError=''; render();
  }
  else if(action==='student-next'){
    const section = SECTIONS[state.studentStep];
    const missing = validateFields(section.fields, state.formData);
    if(missing.length){ state.formError = 'الرجاء تعبئة الحقول التالية: '+missing.join('، '); render(); return; }
    state.formError='';
    state.studentStep++;
    render();
  }
  else if(action==='student-submit'){
    const section = SECTIONS[state.studentStep];
    const missing = validateFields(section.fields, state.formData);
    if(missing.length){ state.formError = 'الرجاء تعبئة الحقول التالية: '+missing.join('، '); render(); return; }
    setBusy(true);
    try{
      const reqNum = await generateRequestNumber();
      const payload = { ...state.formData, requestNumber:reqNum, submittedAt: Date.now(), status:'قيد المراجعة', source:'student' };
      await Store.addRequest(reqNum, payload);
      state.successReqNumber = reqNum;
      state.screen = 'student-success';
    }catch(err){
      state.formError = 'تعذر إرسال الطلب، يرجى المحاولة مجدداً. ('+(err&&err.message?err.message:'خطأ')+')';
    }
    setBusy(false);
    render();
  }
  else if(action==='copy-req'){
    try{
      await navigator.clipboard.writeText(state.successReqNumber);
      el.textContent = 'تم النسخ ✓';
      setTimeout(()=>{ el.textContent='نسخ رقم الطلب'; },1500);
    }catch(err){}
  }
  else if(action==='admin-login-submit'){
    const u = document.getElementById('admin-user-input').value.trim();
    const p = document.getElementById('admin-pass-input').value.trim();
    if(u===ADMIN_USER && p===ADMIN_PASS){
      state.isAdmin=true; state.adminError='';
      setBusy(true);
      try{
        state.requests = await Store.listRequests();
        state.filtered = null;
        state.screen='admin-dashboard';
      }catch(err){
        state.adminError='تعذر تحميل الطلبات: '+(err&&err.message?err.message:'خطأ');
        state.screen='admin-login';
      }
      setBusy(false);
    } else {
      state.adminError='اسم المستخدم أو كلمة المرور غير صحيحة';
    }
    render();
  }
  else if(action==='admin-refresh'){
    setBusy(true);
    try{ state.requests = await Store.listRequests(); state.filtered=null; }catch(err){}
    setBusy(false); render();
  }
  else if(action==='do-search'){
    const nameQ = document.getElementById('search-name-input').value.trim().toLowerCase();
    const statQ = document.getElementById('search-stat-input').value.trim().toLowerCase();
    state.filtered = state.requests.filter(r=>{
      const nameMatch = !nameQ || fullName(r).toLowerCase().includes(nameQ)
        || [r.fatherName,r.paternalGrandfather,r.paternalGreatGrandfather,r.lastName].filter(Boolean).join(' ').toLowerCase().includes(nameQ);
      const statMatch = !statQ || String(r.statisticalNumber||'').toLowerCase().includes(statQ);
      return nameMatch && statMatch;
    });
    render();
  }
  else if(action==='reset-search'){
    state.filtered=null; render();
  }
  else if(action==='admin-add-new'){
    state.formMode='add'; state.formData={}; state.editingId=null; state.formError=''; state.screen='admin-form'; render();
  }
  else if(action==='view-request'){
    const r = state.requests.find(x=>x.id===id); if(r){ state.viewingRequest=r; render(); }
  }
  else if(action==='close-modal'){
    state.viewingRequest=null; render();
  }
  else if(action==='edit-request'){
    const r = state.requests.find(x=>x.id===id);
    if(r){
      state.formMode='edit'; state.editingId=id; state.formData={...r}; state.formError='';
      state.viewingRequest=null; state.screen='admin-form'; render();
    }
  }
  else if(action==='delete-request'){
    if(!confirm('هل أنت متأكد من حذف هذا الطلب؟ لا يمكن التراجع عن هذا الإجراء.')) return;
    setBusy(true);
    try{
      await Store.deleteRequest(id);
      state.requests = await Store.listRequests();
      state.filtered = null;
    }catch(err){ alert('تعذر الحذف: '+(err&&err.message?err.message:'خطأ')); }
    setBusy(false); render();
  }
  else if(action==='admin-cancel-form'){
    state.screen='admin-dashboard'; render();
  }
  else if(action==='admin-save-form'){
    const missing = validateFields(ALL_FIELDS, state.formData);
    if(missing.length){ state.formError='الرجاء تعبئة الحقول التالية: '+missing.join('، '); render(); return; }
    setBusy(true);
    try{
      let id = state.editingId;
      let payload;
      if(state.formMode==='add'){
        id = await generateRequestNumber();
        payload = { ...state.formData, requestNumber:id, submittedAt: Date.now(), status:'قيد المراجعة', source:'admin' };
      } else {
        payload = { ...state.formData, requestNumber:id };
      }
      await Store.updateRequest(id, payload);
      state.requests = await Store.listRequests();
      state.filtered = null;
      state.formError='';
      state.screen='admin-dashboard';
    }catch(err){
      state.formError='تعذر الحفظ: '+(err&&err.message?err.message:'خطأ');
    }
    setBusy(false); render();
  }
  else if(action==='admin-export-excel'){
    setBusy(true);
    try{ await exportToExcel(getFilteredList()); }
    catch(err){ alert('تعذر التصدير: '+(err&&err.message?err.message:'خطأ')); }
    setBusy(false);
  }
}

async function exportToExcel(list){
  if(!downloads){ alert('ميزة تنزيل الملفات غير متاحة في هذا العرض حالياً.'); return; }
  if(!list.length){ alert('لا توجد بيانات لتصديرها.'); return; }
  const headers = ['رقم الطلب','تاريخ التقديم', ...ALL_FIELDS.map(f=>f.label)];
  const rows = list.map(r=>{
    const submitted = r.submittedAt ? new Date(r.submittedAt).toLocaleString('ar-EG') : '';
    return [r.id||'', submitted, ...ALL_FIELDS.map(f=>r[f.key]||'')];
  });
  const wsData = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!views'] = [{ RTL:true }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبات');
  const arrBuf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  const blob = new Blob([arrBuf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  await downloads.save({ filename:'طلبات_الطلاب.xlsx', data: blob });
}

/* ================= بدء التشغيل ================= */
(async function boot(){
  await Store.init();
  state.screen='login';
  render();
})();
</script>
